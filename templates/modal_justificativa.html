<!-- MODAL DE VISUALIZAÇÃO DE JUSTIFICATIVA -->
<div id="modal-justification-view" class="fixed inset-0 z-[110] hidden" aria-labelledby="modal-just-title" role="dialog"
    aria-modal="true">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>

    <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
        <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
            <div
                class="relative transform overflow-hidden rounded-lg bg-white dark:bg-slate-800 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-md border border-amber-200 dark:border-amber-900/50">
                <div
                    class="bg-amber-50 dark:bg-amber-900/20 px-4 py-3 border-b border-amber-100 dark:border-amber-800/50 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div class="p-1.5 bg-amber-100 dark:bg-amber-800/40 rounded-full">
                            <span
                                class="material-symbols-outlined text-amber-600 dark:text-amber-400 text-[20px]">assignment_late</span>
                        </div>
                        <h3 class="text-base font-bold text-amber-900 dark:text-amber-100" id="modal-just-title">
                            Justificativa</h3>
                    </div>
                    <button onclick="document.getElementById('modal-justification-view').classList.add('hidden')"
                        class="text-amber-400 hover:text-amber-600 transition-colors rounded-lg p-1">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="px-6 py-6">
                    <div class="mb-4">
                        <label
                            class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Instituto</label>
                        <div id="modal-just-inst-name" class="text-sm font-semibold text-slate-700 dark:text-slate-200">
                            ---</div>
                    </div>
                    <div
                        class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-4 shadow-sm">
                        <p id="modal-just-text"
                            class="text-sm text-slate-600 dark:text-slate-300 italic leading-relaxed whitespace-pre-wrap">
                            ---</p>
                    </div>
                </div>
                <div class="bg-gray-50 dark:bg-slate-700/30 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                    <button type="button"
                        onclick="document.getElementById('modal-justification-view').classList.add('hidden')"
                        class="inline-flex w-full justify-center rounded-md bg-white dark:bg-slate-800 px-3 py-2 text-sm font-semibold text-gray-900 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-slate-700 sm:ml-3 sm:w-auto">Fechar</button>
                </div>
            </div>
        </div>
    </div>
</div>
