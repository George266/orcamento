<!-- MODAL DE COBRANÇA/CONTATO -->
<div id="modal-contact-view" class="fixed inset-0 z-[110] hidden" aria-labelledby="modal-contact-title" role="dialog"
    aria-modal="true">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>
    <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
        <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
            <div
                class="relative transform overflow-hidden rounded-lg bg-white dark:bg-slate-800 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-md border border-red-200 dark:border-red-900/50">
                <div
                    class="bg-red-50 dark:bg-red-900/20 px-4 py-3 border-b border-red-100 dark:border-red-800/50 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div class="p-1.5 bg-red-100 dark:bg-red-800/40 rounded-full">
                            <span
                                class="material-symbols-outlined text-red-600 dark:text-red-400 text-[20px]">notification_important</span>
                        </div>
                        <h3 class="text-base font-bold text-red-900 dark:text-red-100" id="modal-contact-title">
                            Justificativa Pendente</h3>
                    </div>
                    <button onclick="document.getElementById('modal-contact-view').classList.add('hidden')"
                        class="text-red-400 hover:text-red-600 transition-colors rounded-lg p-1">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="px-6 py-6">
                    <p class="text-sm text-slate-600 dark:text-slate-300 mb-6">
                        O instituto <strong id="modal-contact-inst" class="text-slate-900 dark:text-white">---</strong>
                        não atingiu a meta e não apresentou justificativa.
                    </p>

                    <div class="grid grid-cols-2 gap-3">
                        <a id="btn-contact-whatsapp" href="#" target="_blank"
                            class="flex items-center justify-center gap-2 px-4 py-3 bg-green-500 hover:bg-green-600 text-white rounded-xl transition-colors font-bold text-sm shadow-sm">
                            <span class="material-symbols-outlined">chat</span>
                            WhatsApp
                        </a>
                        <a id="btn-contact-email" href="#"
                            class="flex items-center justify-center gap-2 px-4 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl transition-colors font-bold text-sm shadow-sm">
                            <span class="material-symbols-outlined">mail</span>
                            Email
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
